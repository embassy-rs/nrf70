name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain, components and target from rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            example/target
          key: cargo-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Format
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path example/Cargo.toml

      # The driver with and without its `wpa2` feature, for the target and for the host tests.
      - name: Clippy
        run: |
          cargo clippy --target thumbv8m.main-none-eabihf -- -D warnings
          cargo clippy --target thumbv8m.main-none-eabihf --features wpa2 -- -D warnings
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features wpa2 -- -D warnings
          cd example
          cargo clippy --release -- -D warnings
          cargo clippy --release --all-features -- -D warnings

      - name: Test
        run: |
          cargo test
          cargo test --features wpa2

      - name: Build example
        working-directory: example
        run: cargo build --release --all-features
