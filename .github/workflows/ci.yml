name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain, components and target from rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            example -> target

      - name: Format
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path example/Cargo.toml

      - name: Clippy
        run: |
          cargo clippy --target thumbv8m.main-none-eabihf -- -D warnings
          cargo clippy --all-targets -- -D warnings
          cd example && cargo clippy --release -- -D warnings

      - name: Test
        run: cargo test

      - name: Build example
        working-directory: example
        run: cargo build --release
