[package]
name = "nrf70"
version = "0.2.0"
edition = "2021"
description = "Driver for the Nordic nRF7002 Wi-Fi 6 companion chip, with an embassy-net network driver"
keywords = ["embedded", "nrf7002", "wifi", "embassy-net", "no-std"]
categories = [
    "embedded",
    "hardware-support",
    "no-std",
    "network-programming",
    "asynchronous",
]
# The driver is MIT OR Apache-2.0. It bundles Nordic's nRF70 firmware (fw/nrf70.bin, under the
# Nordic 5-Clause license in fw/LICENSE) and bindings generated from Nordic's BSD-3-Clause nrf_wifi
# headers (fw/bindings.rs).
license = "(MIT OR Apache-2.0) AND BSD-3-Clause AND LicenseRef-Nordic-5-Clause"
repository = "https://github.com/embassy-rs/nrf70"
documentation = "https://docs.rs/nrf70"
readme = "README.md"
# The example, the binding generator and the editor and CI files stay out of the package.
include = [
    "src/**/*",
    "fw/nrf70.bin",
    "fw/bindings.rs",
    "fw/LICENSE",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

# docs.rs shows the whole API.
[package.metadata.docs.rs]
features = ["wpa3", "ap"]

[features]
default = []
# `Control::join_wpa2`: WPA2-Personal networks. The nRF70 firmware has no supplicant, so the key
# handshakes run in the driver. Their HMAC-SHA1, HMAC-SHA256, AES-128 and AES-128-CMAC come from
# `embassy-crypto`, whose drivers the application chooses: the microcontroller's accelerator or
# software.
wpa2 = ["dep:embassy-crypto", "dep:rand_core"]
# `Control::join_wpa3`: WPA3-Personal networks, whose SAE key exchange runs in the driver too, on
# the P-256 arithmetic of the `p256` crate (its hashes on `embassy-crypto`'s HMAC-SHA256).
wpa3 = ["wpa2", "dep:p256"]
# `Control::start_ap_open`: access point mode. The firmware beacons and keeps the stations' links;
# the driver answers probe, authentication and association requests and keeps the frames of
# stations that sleep, as hostapd does in the nRF Connect SDK.
ap = []

# `cargo fuzz` builds with `--cfg fuzzing`, which adds the entry points of `src/fuzz.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
align-data = "0.1.0"
defmt = "1.0.1"
embassy-crypto = { version = "0.1.0", optional = true }
embassy-futures = "0.1.2"
embassy-net-driver-channel = "0.4.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
num_enum = { version = "0.7.4", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "hash2curve"], optional = true }
rand_core = { version = "0.10.1", optional = true }

# The host tests run the supplicant on software HMAC-SHA1 and AES-128, and on embassy-time's std
# time driver, with a timer queue of its own.
[dev-dependencies]
embassy-crypto-rustcrypto = { version = "0.1.0", features = ["embassy-crypto-aes128-cmac", "embassy-crypto-aes128-ecb", "embassy-crypto-hmac-sha1", "embassy-crypto-hmac-sha256"] }
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-8"] }

# Experiment: embassy's main branch, where embassy-net runs on xarxa instead of smoltcp and
# embassy-net-driver-channel hands packets over as xarxa `PacketBuf`s.
[patch.crates-io]
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "5e430e609369998d23c977e9099b5abbddaf775f" }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "5e430e609369998d23c977e9099b5abbddaf775f" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "5e430e609369998d23c977e9099b5abbddaf775f" }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy", rev = "5e430e609369998d23c977e9099b5abbddaf775f" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "5e430e609369998d23c977e9099b5abbddaf775f" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "5e430e609369998d23c977e9099b5abbddaf775f" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "5e430e609369998d23c977e9099b5abbddaf775f" }
