[package]
name = "nrf70"
version = "0.2.0"
edition = "2021"
description = "Driver for the Nordic nRF7002 Wi-Fi 6 companion chip, with an embassy-net network driver"
keywords = ["embedded", "nrf7002", "wifi", "embassy-net", "no-std"]
categories = [
    "embedded",
    "hardware-support",
    "no-std",
    "network-programming",
    "asynchronous",
]
# The driver is MIT OR Apache-2.0. It bundles Nordic's nRF70 firmware (fw/nrf70.bin, under the
# Nordic 5-Clause license in fw/LICENSE) and bindings generated from Nordic's BSD-3-Clause nrf_wifi
# headers (fw/bindings.rs).
license = "(MIT OR Apache-2.0) AND BSD-3-Clause AND LicenseRef-Nordic-5-Clause"
repository = "https://github.com/embassy-rs/nrf70"
documentation = "https://docs.rs/nrf70"
readme = "README.md"
# The example, the binding generator and the editor and CI files stay out of the package.
include = [
    "src/**/*",
    "fw/nrf70.bin",
    "fw/bindings.rs",
    "fw/LICENSE",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

# docs.rs shows the whole API.
[package.metadata.docs.rs]
features = ["wpa3"]

[features]
default = []
# `Control::join_wpa2`: WPA2-Personal networks. The nRF70 firmware has no supplicant, so the key
# handshakes run in the driver, which costs about 30 KB of flash and the crates below.
wpa2 = [
    "dep:aes",
    "dep:aes-kw",
    "dep:cmac",
    "dep:hmac",
    "dep:pbkdf2",
    "dep:rand_core",
    "dep:sha1",
    "dep:sha2",
]
# `Control::join_wpa3`: WPA3-Personal networks, whose SAE key exchange runs in the driver too, on
# the P-256 curve of the `p256` crate.
wpa3 = ["wpa2", "dep:p256"]

[dependencies]
aes = { version = "0.9.0", default-features = false, optional = true }
aes-kw = { version = "0.3.1", default-features = false, optional = true }
align-data = "0.1.0"
cmac = { version = "0.8.0", default-features = false, optional = true }
defmt = "1.0.1"
embassy-futures = "0.1.2"
embassy-net-driver-channel = "0.4.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
hmac = { version = "0.13.0", default-features = false, optional = true }
num_enum = { version = "0.7.4", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "hash2curve"], optional = true }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"], optional = true }
rand_core = { version = "0.10.1", optional = true }
sha1 = { version = "0.11.0", default-features = false, optional = true }
sha2 = { version = "0.11.0", default-features = false, optional = true }
