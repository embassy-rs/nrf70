[package]
name = "nrf70-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nrf70 = { path = "..", features = ["ap", "wpa3"] }
# The driver's HMAC, AES-128 and AES-128-CMAC, in software.
embassy-crypto-rustcrypto = { version = "0.1.0", features = ["embassy-crypto-aes128-cmac", "embassy-crypto-aes128-ecb", "embassy-crypto-hmac-sha1", "embassy-crypto-hmac-sha256"] }

# Not a member of a workspace above.
[workspace]
members = ["."]

# The embassy revision the driver builds against.
[patch.crates-io]
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "a404c7806196df0403b90fb6bef13c80dcee5f2b" }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "a404c7806196df0403b90fb6bef13c80dcee5f2b" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "a404c7806196df0403b90fb6bef13c80dcee5f2b" }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy", rev = "a404c7806196df0403b90fb6bef13c80dcee5f2b" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "a404c7806196df0403b90fb6bef13c80dcee5f2b" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "a404c7806196df0403b90fb6bef13c80dcee5f2b" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "a404c7806196df0403b90fb6bef13c80dcee5f2b" }

[[bin]]
name = "rx_frame"
path = "fuzz_targets/rx_frame.rs"
test = false
doc = false
bench = false

