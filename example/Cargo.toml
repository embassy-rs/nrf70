[package]
name = "nrf70-example"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
default-run = "nrf70-example"

[features]
# The driver's WPA2 support, which `join_wpa2` needs.
wpa2 = ["nrf70/wpa2"]

[[bin]]
name = "join_wpa2"
required-features = ["wpa2"]

[dependencies]
nrf70 = { path = ".." }
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.3"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = ["auto-icmp-echo-reply", "defmt", "dhcpv4", "medium-ethernet", "proto-ipv4", "tcp"] }
embassy-nrf = { version = "0.11.0", features = ["defmt", "gpiote", "nrf5340-app-s", "time-driver-rtc1", "unstable-pac"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-io-async = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"

[profile.dev]
debug = 2
opt-level = 's'
incremental = true
debug-assertions = true
overflow-checks = true

[profile.release]
debug = 2
lto = 'fat'
opt-level = 's'
codegen-units = 1
incremental = false
debug-assertions = false
overflow-checks = false
